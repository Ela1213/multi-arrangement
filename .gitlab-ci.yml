stages:
  - verify
  - build

verify_python:
  stage: verify
  image: python:3.12-slim
  script:
    - python -m py_compile prepare_study.py backend/app/routers/sessions.py smoke_formal.py

verify_javascript:
  stage: verify
  image: node:24-slim
  script:
    - node --check server.mjs
    - node --check public/entry.js
    - node --check public/arrange.js
    - node --check public/setup.js

build_image:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build --pull -f Dockerfile.production -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
